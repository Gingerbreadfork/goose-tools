version: 1.0.0
title: Release watch
description: Weekly summary of new releases for the software you run, with upgrade flags
instructions: |
  Installed versions (EDIT ME and keep current after upgrades): Goose 1.57.0, Playwright MCP 0.0.83, mcp-searxng 2.10.0.
  1. Call read_feeds ONCE with limit_each=5, summary_chars=700 and these URLs (any GitHub project: https://github.com/<owner>/<repo>/releases.atom):
     - https://github.com/aaif-goose/goose/releases.atom
     - https://github.com/microsoft/playwright-mcp/releases.atom
     - https://github.com/ihor-sokoliuk/mcp-searxng/releases.atom
     - https://github.com/modelcontextprotocol/servers/releases.atom
  2. Keep only releases published in the last 7 days (compare the item's published date with today's date from the context).
     Ignore pre-releases, alphas, betas and release candidates unless nothing else exists for that project.
  3. Write "## Releases this week" with one bullet per project that had a release: **Project** [vX.Y.Z](link), date, then one
     sentence on the notable changes taken from the release notes (features, fixes, breaking changes). If the newest version is
     newer than the installed one, end the bullet with "-> upgrade available from <installed>". If a release note mentions a
     breaking change, security fix, or MCP transport change, say so explicitly.
  4. Then "## Quiet this week": comma-separated list of the projects with no release.
  Under 300 words. No preamble, no closing remarks.
  Finally call send_notification with title "Releases this week", tags "package", priority 2 (3 if any upgrade is available) and the
  summary as the message. Then reply with the same summary.
prompt: Summarise this week's releases.
extensions:
  - type: stdio
    name: briefing
    cmd: /PATH/TO/goose-tools/bin/run-tool.sh
    args: [briefing]
    timeout: 120
    description: Weather forecasts and RSS feeds
  - type: stdio
    name: notify
    cmd: /PATH/TO/goose-tools/bin/run-tool.sh
    args: [signal-notify]
    timeout: 60
    description: Push notifications to the user's phone
