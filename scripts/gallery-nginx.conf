# Serves ~/goose-work/images over HTTPS with Goose's own certificate, so Goose Desktop
# (which pins that cert by hostname and allows https images) renders the links in chat.
server {
    listen 8443 ssl;
    ssl_certificate     /etc/nginx/tls/server.pem;
    ssl_certificate_key /etc/nginx/tls/server.key;
    location /images/ {
        alias /srv/images/;
        autoindex on; autoindex_exact_size off; autoindex_localtime on;
        add_header Cache-Control "no-cache";
    }
    location = / { return 302 /images/; }
}
