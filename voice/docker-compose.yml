# Goose voice: LiveKit server + token service + HTTPS call page. Manage with: cd ~/livekit && docker compose up -d
services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"     # signaling for the agent on this host
      - "7881:7881"               # TCP media fallback
      - "7882:7882/udp"           # UDP media (single muxed port)
  token:
    build: ./token
    container_name: livekit-token
    restart: unless-stopped
    env_file: .env
  web:
    image: nginx:alpine
    container_name: livekit-web
    restart: unless-stopped
    ports:
      - "8444:443"                # https://<host>:8444  (call page + wss signaling proxy)
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www:/srv/www:ro
      - ${TLS_DIR:-~/.config/goose/tls}:/etc/nginx/tls:ro
    depends_on: [livekit, token]
