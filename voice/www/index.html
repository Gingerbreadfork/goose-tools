<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talk to Goose</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.7/dist/livekit-client.umd.min.js"></script>
<style>
  :root { --bg:#0b1020; --card:#131a2e; --text:#e8ecf5; --muted:#8b95b0; --accent:#2563eb; --accent2:#f97316; --ok:#10b981; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(1200px 600px at 50% -10%, #1b2a55 0%, var(--bg) 60%); color:var(--text); font-family: -apple-system, "Segoe UI", Roboto, Inter, sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; }
  h1 { font-size:22px; font-weight:600; margin:0 0 6px; letter-spacing:-0.01em; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:28px; }
  .orb { width:180px; height:180px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #5b8cff, var(--accent) 55%, #0f2a7a); box-shadow:0 0 0 0 rgba(37,99,235,.35); display:flex; align-items:center; justify-content:center; font-size:64px; cursor:pointer; user-select:none; transition:transform .2s; border:none; }
  .orb:active { transform:scale(.97); }
  .orb.idle { animation:none; }
  .orb.listening { animation:pulse 1.6s ease-out infinite; }
  .orb.speaking { background:radial-gradient(circle at 35% 30%, #ffb27a, var(--accent2) 55%, #7a2f0f); animation:pulse 1.1s ease-out infinite; }
  .orb.thinking { background:radial-gradient(circle at 35% 30%, #9fb3ff, #475569 60%, #1f2937); animation:breathe 1.4s ease-in-out infinite; }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(255,255,255,.28);} 100% { box-shadow:0 0 0 34px rgba(255,255,255,0);} }
  @keyframes breathe { 0%,100% { transform:scale(1);} 50% { transform:scale(1.06);} }
  .status { margin-top:22px; font-size:15px; color:var(--muted); min-height:22px; }
  .transcript { margin-top:26px; width:min(640px, 100%); max-height:38vh; overflow:auto; display:flex; flex-direction:column; gap:10px; }
  .msg { padding:10px 14px; border-radius:14px; font-size:15px; line-height:1.4; max-width:88%; }
  .msg.you { align-self:flex-end; background:var(--accent); color:white; border-bottom-right-radius:4px; }
  .msg.goose { align-self:flex-start; background:var(--card); border-bottom-left-radius:4px; }
  .bar { margin-top:22px; display:flex; gap:10px; }
  button.small { background:var(--card); color:var(--text); border:1px solid #27324f; border-radius:10px; padding:9px 14px; font-size:14px; cursor:pointer; }
  button.small.danger { border-color:#7f1d1d; color:#fca5a5; }
</style>
</head>
<body>
  <h1>🪿 Talk to Goose</h1>
  <div class="sub">Tap the orb to start a call.</div>
  <button class="orb idle" id="orb" aria-label="Start call">🎙️</button>
  <div class="status" id="status">Not connected</div>
  <div class="transcript" id="transcript"></div>
  <div class="bar">
    <button class="small" id="mute" hidden>Mute</button>
    <button class="small danger" id="hangup" hidden>Hang up</button>
  </div>
<script>
const { Room, RoomEvent, Track } = LivekitClient;
const orb = document.getElementById('orb'), status = document.getElementById('status'), tx = document.getElementById('transcript');
const muteBtn = document.getElementById('mute'), hangBtn = document.getElementById('hangup');
let room = null, muted = false;
const signalUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/livekit';

function setState(s, text) { orb.className = 'orb ' + s; status.textContent = text; }
function addMsg(who, text, id) {
  let el = id ? document.getElementById(id) : null;
  if (!el) { el = document.createElement('div'); el.className = 'msg ' + who; if (id) el.id = id; tx.appendChild(el); }
  el.textContent = text; tx.scrollTop = tx.scrollHeight;
}

async function start() {
  setState('thinking', 'Connecting…');
  const r = await fetch('/token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: 'you' }) });
  const { token } = await r.json();
  room = new Room({ adaptiveStream: true, dynacast: true });
  room.on(RoomEvent.TrackSubscribed, (track) => { if (track.kind === Track.Kind.Audio) { const a = track.attach(); a.autoplay = true; document.body.appendChild(a); } });
  room.on(RoomEvent.AudioPlaybackStatusChanged, async () => { if (!room.canPlaybackAudio) { status.textContent = 'Tap the orb to enable audio'; } });
  room.on(RoomEvent.Disconnected, () => { setState('idle', 'Call ended'); muteBtn.hidden = hangBtn.hidden = true; room = null; });
  // agent state (listening / thinking / speaking) is published as a participant attribute
  room.on(RoomEvent.ParticipantAttributesChanged, (changed, p) => {
    const s = p.attributes && p.attributes['lk.agent.state'];
    if (!s) return;
    if (s === 'speaking') setState('speaking', 'Goose is speaking');
    else if (s === 'thinking') setState('thinking', 'Thinking…');
    else if (s === 'listening') setState('listening', 'Listening');
  });
  // live transcriptions (yours and Goose's) arrive as text streams
  room.registerTextStreamHandler('lk.transcription', async (reader, participant) => {
    const isAgent = (reader.info.attributes || {})['lk.transcribed_track_id'] === undefined && participant.identity !== room.localParticipant.identity;
    const who = participant.identity === room.localParticipant.identity ? 'you' : 'goose';
    const id = 'seg-' + (reader.info.attributes?.['lk.segment_id'] || reader.info.id);
    let text = '';
    for await (const chunk of reader) { text += chunk; addMsg(who, text, id); }
  });
  await room.connect(signalUrl, token);
  await room.startAudio();
  await room.localParticipant.setMicrophoneEnabled(true);
  setState('listening', 'Listening');
  muteBtn.hidden = hangBtn.hidden = false;
}

orb.onclick = async () => {
  if (!room) { try { await start(); } catch (e) { setState('idle', 'Could not connect: ' + (e.message || e)); } }
  else if (!room.canPlaybackAudio) { await room.startAudio(); setState('listening', 'Listening'); }
};
muteBtn.onclick = async () => { muted = !muted; await room.localParticipant.setMicrophoneEnabled(!muted); muteBtn.textContent = muted ? 'Unmute' : 'Mute'; status.textContent = muted ? 'Muted' : 'Listening'; };
hangBtn.onclick = async () => { if (room) await room.disconnect(); };
</script>
</body>
</html>
